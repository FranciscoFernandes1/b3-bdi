name: Atualiza BDI B3

on:
  schedule:
    # 01:30 UTC = 22:30 em Brasília (UTC-3, sem horário de verão desde 2019).
    # Ter-Sáb em UTC corresponde a Seg-Sex em Brasília.
    # O BDI sai à noite: às 17h ainda não está publicado.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela em dias corridos"
        required: false
        default: "21"

concurrency:
  group: bdi-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar pyarrow (opcional)
        continue-on-error: true
        run: pip install -r requirements-parquet.txt

      - name: Cache dos navegadores Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      # Só usado se a API direta falhar (ex.: B3 recusando IP de nuvem).
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Sincronizar
        env:
          # O runner é mais rápido que uma máquina local; espaçar mais evita
          # que a B3 responda 200 com corpo vazio por rajada.
          B3_PAUSA: "2"
        run: python run.py sync --dias "${{ inputs.dias || '21' }}"

      # Uma execução que "passa" mas não coletou nada é pior que uma que falha:
      # o cron segue rodando e a série para de crescer sem ninguém notar.
      - name: Validar que houve coleta
        run: |
          ARQ=dados/curated/bdi_analytical_framework2.csv
          if [ ! -f "$ARQ" ]; then
            echo "::error::$ARQ não existe — nenhuma coleta foi feita."
            exit 1
          fi
          DATAS=$(tail -n +2 "$ARQ" | cut -d';' -f1 | sort -u | wc -l)
          echo "Pregões na série: $DATAS"
          if [ "$DATAS" -lt 5 ]; then
            echo "::error::Apenas $DATAS pregão(ões) — esperado ~15 na janela."
            exit 1
          fi
          echo "### BDI B3" >> $GITHUB_STEP_SUMMARY
          echo "- Pregões na série: **$DATAS**" >> $GITHUB_STEP_SUMMARY
          echo "- Linhas: **$(( $(wc -l < "$ARQ") - 1 ))**" >> $GITHUB_STEP_SUMMARY

      - name: Commitar alterações
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados."
            exit 0
          fi
          git commit -m "dados: atualização automática $(date -u +'%Y-%m-%d')"
          git push

      - name: Publicar artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated
          path: dados/curated/
          retention-days: 30
